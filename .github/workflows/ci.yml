name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Checkout frozen backend protocol fixtures
        uses: actions/checkout@v5
        with:
          repository: cicikat/PresenceKit
          ref: d12f3ff438c7aacc01d3b0b1f66dbba9677267b5
          path: Emerald-presence

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run frontend tests
        run: npm test
        env:
          PRESENCEKIT_PROTOCOL_FIXTURES: ${{ github.workspace }}/Emerald-presence/tests/protocol_fixtures/v1

      - name: Build frontend
        run: npm run build

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Confirm Apple Silicon target
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          if (!(rustc -vV | Select-String 'host: aarch64-apple-darwin')) { throw 'Apple Silicon runner required' }

      - name: Cargo check
        run: cargo check --locked
        working-directory: src-tauri

      - name: Device file tests
        working-directory: src-tauri
        run: cargo test --locked --lib device_file_agent
