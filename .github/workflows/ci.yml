name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout frozen backend protocol fixtures
        uses: actions/checkout@v4
        with:
          repository: cicikat/PresenceKit
          ref: d12f3ff438c7aacc01d3b0b1f66dbba9677267b5
          path: Emerald-presence

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run frontend tests
        run: npm test
        env:
          PRESENCEKIT_PROTOCOL_FIXTURES: ${{ github.workspace }}/Emerald-presence/tests/protocol_fixtures/v1

      - name: Build frontend
        run: npm run build

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check
        working-directory: src-tauri
