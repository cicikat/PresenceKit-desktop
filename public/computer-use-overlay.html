<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      html, body { margin: 0; overflow: hidden; background: transparent; }
      .edge {
        --mist: rgba(88, 168, 251, .38), rgba(120, 192, 255, .13) 38%, transparent;
        position: fixed;
        inset: 0;
        pointer-events: none;
        text-align: center;
        background:
          linear-gradient(to bottom, var(--mist)) top / 100% 48px no-repeat,
          linear-gradient(to top, var(--mist)) bottom / 100% 48px no-repeat,
          linear-gradient(to right, var(--mist)) left / 48px 100% no-repeat,
          linear-gradient(to left, var(--mist)) right / 48px 100% no-repeat;
      }
      #status:not(:empty) {
        display: none;
        margin-top: 8px;
        max-width: calc(100% - 48px);
        border-radius: 16px;
        padding: 5px 13px;
        background: rgba(15, 42, 72, .9);
        color: #f1f8ff;
        font: 600 13px system-ui;
      }
      html[data-cue="legacy"] #status:not(:empty) { display: inline-block; }
      html[data-cue="weak"] .edge { opacity: .33; }
      html:not([data-cue="legacy"]) .edge {
        --mist: rgba(88, 168, 251, .29), rgba(120, 192, 255, .08) 38%, transparent;
        background-size: 100% 24px, 100% 24px, 24px 100%, 24px 100%;
      }
    </style>
    <script defer src="/computer-use-overlay.js"></script>
  </head>
  <body>
    <div class="edge" data-computer-use-overlay><span id="status"></span></div>
  </body>
</html>
